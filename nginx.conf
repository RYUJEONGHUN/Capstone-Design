user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http{
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name xxxxxxxxxxxxxxx; #실제 구매한 도메인으로 변경

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server{
        listen 443 ssl;
        server_name xxxxxxxxxxxxxxxxxxxxxxxx; #실제 구매한 도메인으로 변경

        ssl_certificate /etc/letsencrypt/live/xxxxxxxxxxxxxxx/fullchain.pem; #실제 구매한 도메인으로 변경
        ssl_certificate_key /etc/letsencrypt/live/xxxxxxxxxxxxxxx/privkey.pem; #실제 구매한 도메인으로 변경

        location / {
            proxy_pass http://backend:8080; #spring boot 컨테이너로 트래픽 전달
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

#FastAPI 연결할 때 주석 해제
#         location /ai {
#             proxy_pass http://ai:8000; #fast api 컨테이너로 트래픽 전달
#             proxy_set_header Host $host;
#             proxy_set_header X-Real-IP $remote_addr;
#             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#             proxy_set_header X-Forwarded-Proto $scheme;
#         }
    }
}