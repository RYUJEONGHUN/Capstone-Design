server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      protocol-header: x-forwarded-proto
      remote-ip-header: x-forwarded-for
  #+++++++++++++Nginx 사용시 ssl과 하위 항목 제거++++++++++++++++++++
  ssl:
    enabled: true
    key-store: file:/app/keystore.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: PKCS12

spring:
  application:
    name: incheon_mate-backend


  #  Spring Boot 4.x Mongo 설정 (deprecated 아님)
  mongodb:
    uri: mongodb://${DB_HOST:mongodb}:27017/incheon_mate_db



  data:
    mongodb:
      auto-index-creation: true
    #  Redis는 spring.data.redis 아래가 정석
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379



google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: "https://2025-capstone-design-fe.vercel.app/auth/google/callback"


kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: "https://2025-capstone-design-fe.vercel.app/auth/kakao/callback"
  api:
    key: ${KAKAO_KEY}


jwt:
  secret: ${JWT_SECRET}

#운영환경에서는 swagger 꺼두기
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha



