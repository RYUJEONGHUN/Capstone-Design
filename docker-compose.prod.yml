version: '3.8'

services:
  # 1. 스프링 부트 (백엔드)
  backend:
    container_name: incheon_mate-backend
    build: .
    ports:
      - "443:8080" #Https 기본 포트 443, 다른 포트로 설정시 url뒤에 포트 번호를 붙혀야함
    depends_on:
      - mongodb
      - redis
    restart: always #SSL 인증서 재발급시 재시작
    volumes: #도메인 구매후 수정 필요
      - /etc/letsencrypt/live/우리 도메인/keystore.p12:/app/keystore.p12:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod #어떤 application.yml을 읽을지 결정
      DB_HOST: mongodb
      REDIS_HOST: redis
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      SSL_PASSWORD: ${SSL_PASSWORD}
      TZ: Asia/Seoul
    networks:
      - incheon_mate_network

