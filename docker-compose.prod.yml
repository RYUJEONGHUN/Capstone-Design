version: '3.8'

services:
  backend:
    container_name: incheon_mate-backend
    build: .
    expose:
      - "8080"
    depends_on:
      - redis
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_URI: "${MONGO_URI}"
      SPRING_MONGODB_URI: "${MONGO_URI}"
      REDIS_HOST: redis
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_FRONTEND_REDIRECT_URI: ${KAKAO_FRONTEND_REDIRECT_URI}
      GOOGLE_FRONTEND_REDIRECT_URI: ${GOOGLE_FRONTEND_REDIRECT_URI}
      KAKAO_KEY: ${KAKAO_KEY}
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVER_URL: ${AI_SERVER_URL}
      ODSAY_KEY: ${ODSAY_KEY}
      ADMIN_PASSWARD: ${ADMIN_PASSWARD}
      NAEGIFT_REWARD_URL: ${NAEGIFT_REWARD_URL}
      TZ: Asia/Seoul
    networks:
      - incheon_mate_network

  nginx:
    image: nginx:latest
    container_name: incheon_mate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: always
    networks:
      - incheon_mate_network

  redis:
    image: redis:alpine
    container_name: incheon_mate-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - incheon_mate_network

networks:
  incheon_mate_network:
    driver: bridge
