  # 2. 몽고DB
  mongodb:
    image: mongo:latest
    container_name: incheon_mate-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/mongo:/data/db
    restart: always
    networks:
      - incheon_mate_network

  # 3. 몽고DB 관리툴
  mongo-express:
    image: mongo-express
    container_name: incheon_mate-mongo-express
    restart: always
    ports:
      - "127.0.0.1:8081:8081" #인스턴스에서만 접근하도록 변경
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - incheon_mate_network

  # 4. Redis
  redis:
    image: redis:alpine
    container_name: incheon_mate-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    networks:
      - incheon_mate_network

#5. 네트워크: FastAPI 외부 네트워크 연결용
networks:
  incheon_mate_network:
    external: true