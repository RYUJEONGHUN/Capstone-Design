version: '3.8'

services:
  backend:
    container_name: incheon_mate-backend
    build: .
    expose:
      - "8080"
    depends_on:
      - redis
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: ${MONGO_URI}
      REDIS_HOST: redis
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      FRONTEND_REDIRECT_URI: ${FRONTEND_REDIRECT_URI} # 추가: application.yml로 전달
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVER_URL: ${AI_SERVER_URL}
      TZ: Asia/Seoul
    networks:
      - incheon_mate_network
    volumes: # 💡 추가된 부분: AWS DocumentDB TLS 인증서 마운트
      - ./global-bundle.pem:/app/global-bundle.pem:ro

  nginx:
    image: nginx:latest
    container_name: incheon_mate-nginx
    ports:
      - "80:80" #HTTP 리다이렉트
      - "443:443" #HTTPS 기본 포트
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: always
    networks:
      - incheon_mate_network

  redis:
    image: redis:alpine
    container_name: incheon_mate-redis
    ports:
      - "6379:6379" #redis는 FastAPI와 공유해야하기 때문에 열어줘야한다.
    restart: always
    networks:
      - incheon_mate_network

networks:
  incheon_mate_network:
    driver: bridge